name: Paperweight

options:
  # Xcode 26 app icons are .icon packages (Icon Composer). Without this XcodeGen
  # unpacks the package into loose resources and Xcode never sees the icon.
  fileTypes:
    icon:
      file: true
  bundleIdPrefix: media.baltar.paperweight
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  developmentLanguage: en

schemes:
  Paperweight:
    build:
      targets:
        Paperweight: all
        PaperweightMonitor: all
        PaperweightWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaperweightTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  PaperweightTests:
    build:
      targets:
        PaperweightTests: [test]
    test:
      config: Debug
      targets:
        - PaperweightTests

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

# DEVELOPMENT_TEAM lives in an xcconfig rather than in `settings` above, because
# a build setting written into the project would override the xcconfig and get
# clobbered on every regeneration. See Configs/Signing.xcconfig.
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig

targets:

  Paperweight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Paperweight
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.baltar.paperweight
        INFOPLIST_FILE: Paperweight/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app compiles every view and every shared file, so its build alone
        # sees every string. Scripts/strings-sync.sh merges the .stringsdata it
        # emits into Shared/Resources/Localizable.xcstrings. The extensions only
        # carry the catalog; they never extract.
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Paperweight/Paperweight.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.media.baltar.paperweight
        com.apple.developer.nfc.readersession.formats:
          - TAG
    dependencies:
      - target: PaperweightMonitor
      - target: PaperweightWidget
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: CoreNFC.framework

  PaperweightMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PaperweightMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.baltar.paperweight.monitor
        INFOPLIST_FILE: PaperweightMonitor/Info.plist
    entitlements:
      path: PaperweightMonitor/PaperweightMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.media.baltar.paperweight
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

  # Widget extension. Its source list is enumerated file-by-file rather than
  # pulling in all of `Shared` on purpose: the widget must never see
  # FamilyActivitySelection or the Family Controls entitlement. It reads only the
  # token-free WidgetSnapshot from the App Group.
  PaperweightWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PaperweightWidget
      - path: Shared/Theme.swift
      - path: Shared/Constants.swift
      - path: Shared/Models/PaperweightSchedule.swift
      - path: Shared/Models/PaperweightSchedule+Week.swift
      - path: Shared/Models/DayKey.swift
      - path: Shared/Models/DayException.swift
      - path: Shared/Models/ScheduleResolver.swift
      - path: Shared/Models/WidgetSnapshot.swift
      - path: Shared/Models/WidgetPresentation.swift
      - path: Shared/Store/WidgetSnapshotStore.swift
      - path: Shared/Resources/Localizable.xcstrings
      - path: Paperweight/Views/Components/QuietGlassMotifs.swift
      - path: Paperweight/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.baltar.paperweight.widget
        INFOPLIST_FILE: PaperweightWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: PaperweightWidget/PaperweightWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.media.baltar.paperweight
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  PaperweightTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PaperweightTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.baltar.paperweight.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: CoreNFC.framework
